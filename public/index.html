<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Ziemniak 🥔</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Ekran główny -->
    <div id="screen-menu" class="screen active">
      <h1>🥔 Daily Ziemniak</h1>
      <p class="subtitle">Kto bierze laptopa na daily?</p>
      <div class="menu-buttons">
        <button id="btn-create">STWÓRZ SESJĘ</button>
        <button id="btn-join-menu">DOŁĄCZ DO SESJI</button>
      </div>
    </div>

    <!-- Ekran tworzenia sesji -->
    <div id="screen-create" class="screen">
      <h1>🥔 Daily Ziemniak</h1>
      <p class="subtitle">Stwórz sesję</p>
      <div class="login-form">
        <input type="text" id="create-nick-input" placeholder="Wpisz swój nick" maxlength="20" autocomplete="off">
        <button id="btn-create-confirm">STWÓRZ</button>
        <p id="create-error" class="error"></p>
      </div>
    </div>

    <!-- Ekran dołączania -->
    <div id="screen-join" class="screen">
      <h1>🥔 Daily Ziemniak</h1>
      <p class="subtitle">Dołącz do sesji</p>
      <div class="login-form">
        <input type="text" id="join-code-input" placeholder="Kod sesji (4 litery)" maxlength="4" autocomplete="off">
        <input type="text" id="join-nick-input" placeholder="Wpisz swój nick" maxlength="20" autocomplete="off">
        <button id="btn-join-confirm">DOŁĄCZ</button>
        <p id="join-error" class="error"></p>
      </div>
    </div>

    <!-- Ekran lobby -->
    <div id="screen-lobby" class="screen">
      <h1>🥔 Daily Ziemniak</h1>
      <h2>Lobby</h2>
      <div id="session-code-display"></div>
      <div id="player-list-container">
        <h3>Gracze (<span id="player-count">0</span>):</h3>
        <ul id="player-list"></ul>
      </div>
      <div id="host-controls" class="hidden">
        <button id="btn-start">START</button>
      </div>
      <p id="lobby-info">Czekam na hosta...</p>
      <p id="lobby-error" class="error"></p>
    </div>

    <!-- Ekran gry -->
    <div id="screen-game" class="screen">
      <h1>🥔 Daily Ziemniak</h1>
      <div id="game-status"></div>
      <div id="game-holder-info"></div>
      <div id="game-action" class="hidden">
        <button id="btn-throw">RZUĆ LAPTOPEM 💻</button>
      </div>
      <div id="host-cancel" class="hidden">
        <button id="btn-cancel">ANULUJ RUNDĘ</button>
      </div>
    </div>

    <!-- Ekran wyniku -->
    <div id="screen-result" class="screen">
      <h1>🥔 Daily Ziemniak</h1>
      <div id="result-message"></div>
      <div id="host-restart" class="hidden">
        <button id="btn-restart">NASTĘPNA RUNDA</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
  <footer id="version-footer"></footer>
</body>
</html>
